name: Daily Oil & Gas Data Sync

on:
  schedule:
    - cron: '0 4 * * *'  # Runs automatically every day at 4:00 AM UTC
  workflow_dispatch:      # Allows manual trigger via GitHub web UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas fastparquet pyarrow

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Parquet Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: daily well data update [skip ci]"
          file_pattern: "wells_data.parquet"
