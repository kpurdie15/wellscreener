name: Daily Oil & Gas Data Sync

on:
  schedule:
    - cron: '0 4 * * *'  # Runs automatically every day at 4:00 AM UTC
  workflow_dispatch:      # Allows manual trigger via GitHub web UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas fastparquet pyarrow

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Parquet Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wells_data.parquet
          git commit -m "auto: daily well data update [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
